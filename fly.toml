# Ruang Pulih — config deploy Fly.io
# Docs: https://fly.io/docs/reference/configuration/

app = 'ruangpulih'
primary_region = 'sin'   # Singapore — terdekat ke Indonesia

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # WAJIB false: WebSocket chat butuh koneksi terus-terusan
  auto_start_machines = true
  min_machines_running = 1     # jangan idle sampai mati total

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

# WebSocket butuh waktu lama (chat sesi konseling) — naikkan timeout proxy
[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  method = 'GET'
  path = '/api/layanan'
  timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[mounts]]
  source = 'ruangpulih_data'
  destination = '/app/data'
