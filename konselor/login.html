<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Konselor — Ruang Pulih</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <main class="login-wrap">
    <h1>Login Konselor</h1>
    <p class="sub">Area ini hanya untuk konselor Ruang Pulih. Setiap aktivitas tercatat dalam audit log.</p>
    <form id="formLogin" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="sandi">Sandi</label>
      <input id="sandi" name="sandi" type="password" autocomplete="current-password" required>
      <p class="err" id="err" role="alert"></p>
      <button class="btn-masuk" type="submit">Masuk</button>
      <a class="kembali" href="/">Kembali ke halaman utama</a>
    </form>
  </main>
  <script src="/js/konselor-login.js"></script>
</body>
</html>
